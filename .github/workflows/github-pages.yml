name: RobotForge Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || vars.ROBOTFORGE_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.13.0'
          cache: npm
      # Match the lockfile's resolver and the locally verified toolchain.
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: npm run test:libraries
      - run: npm run test:development
      - run: npm run test:can-addresses
      - run: npm run test:drivetrains
      - run: npm run test:wizard
      - run: npm run test:designer
      - run: npm run build:pages
      - run: npm run test:pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request' && vars.ROBOTFORGE_PAGES_ENABLED == 'true'
        with:
          path: dist-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ROBOTFORGE_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
